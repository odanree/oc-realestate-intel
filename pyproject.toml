[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oc-realestate-intel"
version = "0.1.0"
description = "Multi-agent LangGraph system over Orange County real estate + title data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Danh Le", email = "dtle82@gmail.com" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.9",
    "neo4j>=5.20",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langchain>=1.0",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "langfuse>=2.50",
    "agent-governance @ git+https://github.com/odanree/agent-governance.git@v0.2.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    # evalkit is installed via `pip install -e ../evalkit[anthropic]`
    # (sibling repo). Not pinned here so the dev install pulls editable.
]

[tool.hatch.metadata]
# Required because `agent-governance` is pulled directly from GitHub via
# `git+https://...@v0.2.1` in [project.dependencies]. Without this flag,
# Hatchling 1.x rejects direct-URL deps with:
#   "Dependency #N of field `project.dependencies` cannot be a direct
#    reference unless field `tool.hatch.metadata.allow-direct-references`
#    is set to `true`"
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
